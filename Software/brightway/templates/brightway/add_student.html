<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #f4f6f8;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
        }
        .sidebar {
            width: 220px;
            background: #23272f;
            color: #fff;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }
        .sidebar h2 {
            margin: 0;
            padding: 24px 0 16px 32px;
            font-size: 1.4em;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .sidebar ul li a {
            display: block;
            padding: 14px 32px;
            color: #fff;
            text-decoration: none;
            transition: background 0.2s;
        }
        .sidebar ul li a:hover {
            background: #3a3f51;
        }
        .main {
            margin-left: 220px;
            padding: 40px;
        }
        .form-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 32px;
            max-width: 500px;
            margin: 40px auto;
        }
        h2 {
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 12px;
        }
        input, select, textarea {
            margin-top: 4px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .btn {
            background: #23272f;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #3a3f51;
        }
        @media (max-width: 700px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main {
                margin-left: 0;
                padding: 16px;
            }
            .form-card {
                margin: 16px auto;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Brightway Admin</h2>
        <ul>
            <li><a href="{% url 'index' %}">Dashboard</a></li>
            <li><a href="{% url 'students_list' %}">Students</a></li>
            <li><a href="{% url 'attendance_list' %}">Attendance</a></li>
            <li><a href="{% url 'fee_reports_list' %}">Fee Reports</a></li>
            <li><a href="{% url 'defaulters_list' %}">Defaulters</a></li>
        </ul>
    </div>
    <div class="main">
        <div class="form-card">
            <h2>Add New Student</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
