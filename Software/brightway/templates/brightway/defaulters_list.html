<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fee Defaulters</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .container { max-width: 900px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 32px; }
        h2 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f4f6f8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fee Defaulters</h2>
        <table>
            <tr>
                <th>Student</th>
                <th>Month</th>
            </tr>
            {% for defaulter in defaulters %}
            <tr>
                <td>{{ defaulter.student.first_name }} {{ defaulter.student.last_name }}</td>
                <td>{{ defaulter.fee_report.month }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2">No defaulters found.</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
