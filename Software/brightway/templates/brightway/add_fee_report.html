<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Fee Report</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 32px; }
        h2 { margin-top: 0; }
        form { display: flex; flex-direction: column; }
        label { margin-top: 12px; }
        input, select, textarea { margin-top: 4px; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        .btn { background: #23272f; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 20px; }
        .btn:hover { background: #3a3f51; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add Fee Report</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
</body>
</html>
